/* ══ SHARED GLOBE RENDERER ══════════════════════════════════════════ */
function drawGlobe(canvas, rot, pulse, accentColor){
  const ctx=canvas.getContext('2d');
  const S=canvas.width, cx=S/2, cy=S/2, r=S/2-8;
  ctx.clearRect(0,0,S,S);
  const og=ctx.createRadialGradient(cx,cy,r*.8,cx,cy,r+20);
  og.addColorStop(0,accentColor+'28'); og.addColorStop(1,'transparent');
  ctx.beginPath();ctx.arc(cx,cy,r+20,0,Math.PI*2);ctx.fillStyle=og;ctx.fill();
  const sg=ctx.createRadialGradient(cx-r*.3,cy-r*.3,0,cx,cy,r);
  sg.addColorStop(0,'#1E3A6E');sg.addColorStop(.6,'#0C1E40');sg.addColorStop(1,'#050C1A');
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=sg;ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();
  for(let lat=-75;lat<=75;lat+=25){
    const latR=lat*Math.PI/180,ry=r*Math.sin(latR),rx=r*Math.cos(latR);
    const b=1-Math.abs(lat)/90;
    ctx.strokeStyle=`rgba(0,212,255,${0.05+b*0.08})`;ctx.lineWidth=0.5;
    ctx.beginPath();ctx.ellipse(cx,cy+ry,rx,rx*.18,0,0,Math.PI*2);ctx.stroke();
  }
  for(let lng=0;lng<360;lng+=25){
    const angle=((lng+rot)%360)*Math.PI/180,sx=Math.cos(angle),a=(sx+1)/2;
    ctx.strokeStyle=`rgba(0,212,255,${a*0.1})`;ctx.lineWidth=0.5;
    ctx.beginPath();ctx.ellipse(cx,cy,Math.abs(sx)*r,r,0,0,Math.PI*2);ctx.stroke();
  }
  ctx.fillStyle='rgba(0,212,255,0.04)';
  [[.15,20,.1,.2,.2],[.3,-70,.09,.24,.15],[.2,90,.18,.13,0],[-0.1,-20,.06,.1,0]].forEach(([xm,lng,rx2,ry2,sk])=>{
    const x=cx+r*xm*Math.sin(((lng+rot)%360)*Math.PI/180);
    ctx.beginPath();ctx.ellipse(x,cy,r*rx2,r*ry2,sk,0,Math.PI*2);ctx.fill();
  });
  ctx.restore();
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle=accentColor+'88';ctx.lineWidth=1.2;ctx.stroke();
  const hi=ctx.createRadialGradient(cx-r*.35,cy-r*.35,0,cx-r*.35,cy-r*.35,r*.4);
  hi.addColorStop(0,'rgba(255,255,255,0.14)');hi.addColorStop(1,'transparent');
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=hi;ctx.fill();
  const pv=(Math.sin(pulse*.07)+1)/2;
  GLOBE_DOTS.forEach(dot=>{
    const la=((dot.lng+rot)%360+360)%360,lr=la*Math.PI/180,latR=dot.lat*Math.PI/180;
    const sinL=Math.sin(lr-Math.PI);
    if(sinL<-0.15)return;
    const vis=Math.max(0,Math.min(1,(sinL+0.15)/.5));
    const x=cx+r*Math.cos(latR)*Math.sin(lr-Math.PI),y=cy-r*Math.sin(latR);
    const pr=5+pv*6;
    const rg=ctx.createRadialGradient(x,y,1,x,y,pr+3);
    rg.addColorStop(0,dot.color+Math.round(vis*100).toString(16).padStart(2,'0'));
    rg.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(x,y,pr+3,0,Math.PI*2);ctx.fillStyle=rg;ctx.fill();
    ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);
    ctx.fillStyle=dot.color+Math.round(vis*255).toString(16).padStart(2,'0');
    ctx.shadowColor=dot.color;ctx.shadowBlur=6;ctx.fill();ctx.shadowBlur=0;
  });
}

/* small globe for onboarding */
function OnboardGlobe({color}){
  const ref=useRef(null),rot=useRef(180),pulse=useRef(0),frame=useRef(null);
  useEffect(()=>{
    const c=ref.current;if(!c)return;
    c.width=150;c.height=150;
    const tick=()=>{
      drawGlobe(c,rot.current,pulse.current,color);
      rot.current+=0.3;pulse.current+=1;
      frame.current=requestAnimationFrame(tick);
    };
    tick();
    return()=>cancelAnimationFrame(frame.current);
  },[color]);
  return <canvas ref={ref} style={{display:"block",width:160,height:160}}/>;
}

/* large globe for agent board */
function Globe(){
  const ref=useRef(null),rot=useRef(0),pulse=useRef(0),frame=useRef(null);
  useEffect(()=>{
    const c=ref.current;if(!c)return;
    const resize=()=>{
      const p=c.parentElement;
      const s=Math.min(p?p.offsetWidth:300,300);
      c.width=s;c.height=s;
    };
    resize();
    window.addEventListener('resize',resize);
    const tick=()=>{
      drawGlobe(c,rot.current,pulse.current,"#00D4FF");
      rot.current+=0.25;pulse.current+=1;
      frame.current=requestAnimationFrame(tick);
    };
    tick();
    return()=>{cancelAnimationFrame(frame.current);window.removeEventListener('resize',resize);};
  },[]);
  return(
    <div style={{width:"100%",maxWidth:260,margin:"0 auto 8px",position:"relative"}}>
      <canvas ref={ref} style={{display:"block",width:"100%",height:"auto"}}/>
    </div>
  );
}

          {step<slides.length-1?"Continue →":"Get Started →"}

      </div>
    </div>
  );
}

/* ══ KYC ════════════════════════════════════════════════════════════ */
function KYCScreen({user,setUser,onBack}){
  const [step,setStep]=useState(user.kycDone?"done":"form");
  const [docType,setDocType]=useState("");
  const [fname,setFname]=useState("");
  const [lname,setLname]=useState("");
  const [dob,setDob]=useState("");
  const [submitting,setSubmitting]=useState(false);
  function submit(){
    if(!fname||!lname||!dob||!docType)return;
    setSubmitting(true);
    setTimeout(()=>{setSubmitting(false);setUser(u=>({...u,kycDone:true}));setStep("done");},2500);
  }
  if(step==="done")return(
    <div style={{padding:"40px 18px",textAlign:"center",animation:"fadeUp .4s ease"}}>
      <div style={{fontSize:64,marginBottom:16}}>✅</div>
      <div style={{fontFamily:"var(--fh)",fontWeight:800,fontSize:24,color:"#00E5A0",marginBottom:10}}>Identity Verified</div>
      <div style={{fontSize:14,color:"var(--txt2)",lineHeight:1.7,marginBottom:24}}>Your account is fully verified. Withdrawals are now enabled with no limits.</div>
      <button onClick={onBack} style={{padding:"14px 40px",borderRadius:12,border:"none",background:"linear-gradient(135deg,#00D4FF,#0055DD)",color:"#fff",fontFamily:"var(--fh)",fontWeight:700,fontSize:15,cursor:"pointer"}}>Done</button>
    </div>
  );
  return(
    <div style={{animation:"fadeUp .4s ease"}}>
      <div style={{background:"linear-gradient(145deg,#081428,#0C1E40)",padding:"24px 18px 20px",borderRadius:"0 0 24px 24px",marginBottom:20}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:4}}>
          <button onClick={onBack} style={{background:"none",border:"none",color:"var(--txt2)",cursor:"pointer",fontSize:20}}>←</button>
          <div style={{fontFamily:"var(--fh)",fontWeight:800,fontSize:20}}>ID Verification</div>
        </div>
        <div style={{fontSize:13,color:"var(--txt2)",marginLeft:40}}>Required for withdrawals above $50</div>
      </div>
      <div style={{padding:"0 16px"}}>
        <div style={{background:"rgba(255,184,0,.08)",border:"1px solid rgba(255,184,0,.22)",borderRadius:12,padding:"12px 14px",marginBottom:20,display:"flex",gap:10}}>
          <span style={{fontSize:18}}>🔒</span>
          <div><div style={{fontWeight:600,fontSize:13,color:"#FFB800",marginBottom:2}}>Your data is secure</div><div style={{fontSize:12,color:"var(--txt2)"}}>DEELAi uses 256-bit encryption. Your documents are never shared with third parties.</div></div>
        </div>
        {[["First Name",fname,setFname,"text","e.g. Amara"],["Last Name",lname,setLname,"text","e.g. Osei"],["Date of Birth",dob,setDob,"date",""]].map(([label,val,setter,type,ph])=>(
          <div key={label} style={{marginBottom:14}}>
            <div style={{fontSize:11,color:"var(--txt2)",fontFamily:"var(--fm)",letterSpacing:1,marginBottom:6}}>{label.toUpperCase()}</div>
            <input type={type} value={val} onChange={e=>setter(e.target.value)} placeholder={ph} style={{width:"100%",padding:"13px 14px",borderRadius:12,background:"var(--s2)",border:"1px solid var(--b2)",color:"#fff",fontSize:14,outline:"none"}}/>
          </div>
        ))}
        <div style={{marginBottom:20}}>
          <div style={{fontSize:11,color:"var(--txt2)",fontFamily:"var(--fm)",letterSpacing:1,marginBottom:8}}>DOCUMENT TYPE</div>
          <div style={{display:"flex",gap:8}}>
            {["NIN","BVN","Passport","Voter's Card"].map(d=>(
              <button key={d} onClick={()=>setDocType(d)} style={{flex:1,padding:"10px 4px",borderRadius:10,border:`1px solid ${docType===d?"var(--cyan)":"var(--b2)"}`,background:docType===d?"var(--cyan-d)":"var(--s2)",color:docType===d?"var(--cyan)":"var(--txt2)",fontSize:11,cursor:"pointer",fontFamily:"var(--fm)"}}>{d}</button>

        <div style={{height:24}}/>
      </div>
    </div>
  );
}

function TrainingScreen({user,setUser}){
  const [view,setView]=useState("list");
  const [modId,setModId]=useState(null);
  const [qi,setQi]=useState(0);
  const [sel,setSel]=useState(null);
  const [answers,setAnswers]=useState([]);
  const [quizDone,setQuizDone]=useState(false);
  const [paying,setPaying]=useState(false);
  const done=user.completedModules||[];
  const pct=Math.round((done.length/MODULES.length)*100);
  const allDone=done.length>=MODULES.length;
  function completeModule(id){if(done.includes(id))return;setUser(u=>({...u,completedModules:[...done,id]}));setView("list");}
  function handleAnswer(i){
    setSel(i);
    setTimeout(()=>{
      const newA=[...answers,{q:qi,sel:i,ans:QUIZ[qi].ans}];
      setAnswers(newA);
      if(qi<QUIZ.length-1){setQi(qi+1);setSel(null);}
      else{const score=newA.filter(a=>a.sel===a.ans).length;setQuizDone(true);if(score>=5){setUser(u=>({...u,quizPassed:true}));setView("cert");}}
    },650);
  }
  function activateLens(){setPaying(true);setTimeout(()=>{setPaying(false);setUser(u=>({...u,lensActivated:true,trainingDone:true,salary:Math.max(0,u.salary-3.8)}));setView("list");},2200);}

        <div style={{fontFamily:"var(--fh)",fontWeight:700,fontSize:18,color:"#FFB800",marginBottom:4}}>{user.name}</div>
        <div style={{fontSize:12,color:"var(--txt2)",marginBottom:16}}>has successfully completed the DEELAi Image Annotation Certification with a passing score.</div>

        <div style={{fontSize:13,color:"var(--txt2)",lineHeight:1.7,marginBottom:16}}>Your <strong style={{color:"#fff"}}>Virtual Annotation Lens</strong> calibrates your visual precision to match AI model standards. Every certified annotator activates one before their first job.</div>

  if(step==="success")return(<div style={{padding:"40px 18px",textAlign:"center",animation:"fadeUp .4s ease"}}><div style={{fontSize:60}}>🎉</div><div style={{fontFamily:"var(--fh)",fontWeight:800,fontSize:24,marginTop:16,color:"#00E5A0"}}>Withdrawal Submitted!</div><div style={{color:"var(--txt2)",marginTop:8,fontSize:14}}><strong style={{color:"#fff"}}>${parseFloat(amount||0).toFixed(2)}</strong> is being processed. Delivery: <strong style={{color:"#fff"}}>1–2 business days</strong></div><div style={{margin:"24px 0",background:"var(--s1)",borderRadius:16,padding:"18px",border:"1px solid var(--b2)",textAlign:"left"}}><div style={{fontSize:10,color:"var(--txt2)",fontFamily:"var(--fm)",letterSpacing:1,marginBottom:8}}>TRANSACTION REF</div><div style={{fontFamily:"var(--fm)",color:"var(--cyan)",fontSize:13}}>TXN-{Date.now().toString().slice(-8)}</div></div><button onClick={()=>{setStep("main");setAmount("");setBank("");setAcct("");setMethod(null);}} style={{padding:"14px 40px",borderRadius:12,border:"none",background:"linear-gradient(135deg,#00D4FF,#0055DD)",color:"#fff",fontFamily:"var(--fh)",fontWeight:700,fontSize:15,cursor:"pointer"}}>Back to Wallet</button></div>);
  if(step==="confirm")return(<div style={{padding:"24px 18px",animation:"fadeUp .4s ease"}}><button onClick={()=>setStep("amount")} style={{background:"none",border:"none",color:"var(--txt2)",cursor:"pointer",fontSize:13,marginBottom:20}}>← Back</button><div style={{fontFamily:"var(--fh)",fontWeight:800,fontSize:22,marginBottom:20}}>Confirm Withdrawal</div>{[["Amount",`$${parseFloat(amount||0).toFixed(2)}`],["Method",methods.find(m=>m.id===method)?.label||"—"],["Destination",bank||"—"],["Account",acct||"—"],["Processing Fee","$0.00"],["You Receive",`$${parseFloat(amount||0).toFixed(2)}`]].map(([k,v])=><div key={k} style={{display:"flex",justifyContent:"space-between",padding:"12px 0",borderBottom:"1px solid var(--b1)"}}><span style={{color:"var(--txt2)",fontSize:14}}>{k}</span><span style={{fontWeight:600,fontSize:14}}>{v}</span></div>)}<button onClick={()=>{setUser(u=>({...u,salary:Math.max(0,u.salary-parseFloat(amount||0))}));setStep("success");}} style={{width:"100%",marginTop:26,padding:"15px",borderRadius:12,border:"none",background:"linear-gradient(135deg,#00E5A0,#00B37E)",color:"#000",fontFamily:"var(--fh)",fontWeight:700,fontSize:15,cursor:"pointer"}}>Confirm &amp; Submit →</button></div>);
  if(step==="amount")return(<div style={{padding:"24px 18px",animation:"fadeUp .4s ease"}}><button onClick={()=>setStep("method")} style={{background:"none",border:"none",color:"var(--txt2)",cursor:"pointer",fontSize:13,marginBottom:20}}>← Back</button><div style={{fontFamily:"var(--fh)",fontWeight:800,fontSize:22,marginBottom:18}}>Enter Amount</div><div style={{marginBottom:14}}><div style={{fontSize:10,color:"var(--txt2)",fontFamily:"var(--fm)",letterSpacing:1,marginBottom:6}}>WITHDRAWAL AMOUNT</div><div style={{position:"relative"}}><span style={{position:"absolute",left:14,top:"50%",transform:"translateY(-50%)",fontSize:18,color:"var(--cyan)",fontFamily:"var(--fh)",fontWeight:700}}>$</span><input type="number" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0.00" style={{width:"100%",padding:"14px 14px 14px 36px",borderRadius:12,background:"var(--s2)",border:"1px solid var(--b2)",color:"#fff",fontSize:22,fontFamily:"var(--fh)",fontWeight:700,outline:"none"}}/></div><div style={{marginTop:6,fontSize:12,color:"var(--txt2)"}}>Available: <strong style={{color:"#00E5A0"}}>${user.salary.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}</strong> · Min: $10.00</div></div>{method==="bank"&&<><div style={{marginBottom:12}}><div style={{fontSize:10,color:"var(--txt2)",fontFamily:"var(--fm)",letterSpacing:1,marginBottom:6}}>BANK NAME</div><input value={bank} onChange={e=>setBank(e.target.value)} placeholder="e.g. Zenith Bank, GTBank..." style={{width:"100%",padding:"13px 14px",borderRadius:12,background:"var(--s2)",border:"1px solid var(--b2)",color:"#fff",fontSize:14,outline:"none"}}/></div><div style={{marginBottom:18}}><div style={{fontSize:10,color:"var(--txt2)",fontFamily:"var(--fm)",letterSpacing:1,marginBottom:6}}>ACCOUNT NUMBER</div><input value={acct} onChange={e=>setAcct(e.target.value)} placeholder="10-digit account number" style={{width:"100%",padding:"13px 14px",borderRadius:12,background:"var(--s2)",border:"1px solid var(--b2)",color:"#fff",fontSize:14,outline:"none"}}/></div></>}<button disabled={!amount||parseFloat(amount)<10||parseFloat(amount)>user.salary} onClick={()=>setStep("confirm")} style={{width:"100%",padding:"15px",borderRadius:12,border:"none",background:amount&&parseFloat(amount)>=10&&parseFloat(amount)<=user.salary?"linear-gradient(135deg,#00D4FF,#0055DD)":"var(--s3)",color:amount&&parseFloat(amount)>=10?"#fff":"var(--txt3)",fontFamily:"var(--fh)",fontWeight:700,fontSize:15,cursor:"pointer"}}>Continue →</button></div>);
  if(step==="method")return(<div style={{padding:"24px 18px",animation:"fadeUp .4s ease"}}><button onClick={()=>setStep("main")} style={{background:"none",border:"none",color:"var(--txt2)",cursor:"pointer",fontSize:13,marginBottom:20}}>← Back</button><div style={{fontFamily:"var(--fh)",fontWeight:800,fontSize:22,marginBottom:6}}>Choose Method</div><div style={{fontSize:13,color:"var(--txt2)",marginBottom:22}}>Select your preferred withdrawal channel.</div>{methods.map(m=><div key={m.id} onClick={()=>{setMethod(m.id);setStep("amount");}} style={{background:"var(--s1)",border:`1px solid ${method===m.id?m.c+"55":"var(--b1)"}`,borderRadius:14,padding:"16px",marginBottom:10,cursor:"pointer",display:"flex",alignItems:"center",gap:14}}><div style={{width:46,height:46,borderRadius:12,background:`${m.c}18`,border:`1px solid ${m.c}30`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>{m.icon}</div><div style={{flex:1}}><div style={{fontWeight:600,fontSize:15}}>{m.label}</div><div style={{fontSize:12,color:"var(--txt2)",marginTop:2}}>{m.sub}</div></div><span style={{color:"var(--txt2)",fontSize:16}}>→</span></div>)}</div>);
  return(
    <div style={{animation:"fadeUp .4s ease"}}>
      <div style={{background:"linear-gradient(150deg,#081428,#0C2044,#081830)",padding:"26px 18px 24px",borderRadius:"0 0 24px 24px",marginBottom:20}}>
        <div style={{fontFamily:"var(--fh)",fontWeight:800,fontSize:22,marginBottom:16}}>My Wallet</div>
        <div style={{fontSize:10,color:"var(--txt2)",fontFamily:"var(--fm)",letterSpacing:2,textTransform:"uppercase",marginBottom:6}}>Salary Balance</div>
        <div style={{fontFamily:"var(--fh)",fontWeight:800,fontSize:46,letterSpacing:-1.5,lineHeight:1}}><span style={{fontSize:22,color:"var(--cyan)",verticalAlign:"top",marginTop:10,display:"inline-block"}}>$</span>{user.salary.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        <div style={{fontSize:12,color:"var(--txt2)",marginTop:8}}>Total earned: <strong style={{color:"#00E5A0"}}>${(user.salary+1023.8).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}</strong> · Withdrawn: <strong style={{color:"#FF4D6D"}}>$1,023.80</strong></div>
        <div style={{display:"flex",gap:10,marginTop:18}}>
          <button onClick={()=>canWithdraw&&setStep("method")} style={{flex:1,padding:"13px",borderRadius:12,border:"none",background:canWithdraw?"linear-gradient(135deg,#00E5A0,#00B37E)":"var(--s3)",color:canWithdraw?"#000":"var(--txt3)",fontFamily:"var(--fh)",fontWeight:700,fontSize:14,cursor:canWithdraw?"pointer":"not-allowed"}}>💸 Withdraw</button>
          <button style={{flex:1,padding:"13px",borderRadius:12,border:"1px solid var(--b2)",background:"var(--s1)",color:"var(--txt)",fontFamily:"var(--fh)",fontWeight:600,fontSize:14,cursor:"pointer"}}>📊 Report</button>
        </div>
        {!canWithdraw&&<div style={{marginTop:10,fontSize:11,color:"var(--txt3)",fontFamily:"var(--fm)"}}>{!user.trainingDone?"⚠️ Complete training first":!user.lensActivated?"⚠️ Activate your Annotation Lens":"⚠️ Min withdrawal: $10.00"}</div>}
      </div>
      <div style={{padding:"0 18px"}}>
        <div style={{display:"flex",gap:8,marginBottom:16}}>
          {[["This Month",`$${(user.salary*.6).toFixed(2)}`,"#00D4FF"],["Withdrawn","$1,023.80","#FF4D6D"],["Pending","$0.00","#FFB800"]].map(([l,v,c])=>(
            <div key={l} style={{flex:1,background:"var(--s1)",border:"1px solid var(--b1)",borderRadius:12,padding:"10px 11px"}}>
              <div style={{fontSize:9,color:"var(--txt2)",fontFamily:"var(--fm)",letterSpacing:1}}>{l.toUpperCase()}</div>
              <div style={{fontFamily:"var(--fh)",fontWeight:700,color:c,fontSize:15,marginTop:4}}>{v}</div>
            </div>
          ))}
        </div>
        <div style={{background:"rgba(0,229,160,.07)",border:"1px solid rgba(0,229,160,.22)",borderRadius:12,padding:"12px 14px",marginBottom:16,display:"flex",gap:10,alignItems:"center"}}>
          <span style={{fontSize:18}}>📅</span>
          <div><div style={{fontSize:13,fontWeight:600,color:"#00E5A0"}}>Next Payout: Friday, May 23</div><div style={{fontSize:11,color:"var(--txt2)",marginTop:1}}>Your salary will be processed automatically</div></div>
        </div>
        <div style={{fontFamily:"var(--fh)",fontWeight:700,fontSize:15,marginBottom:12}}>Transaction History</div>
        {txns.map((t,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"13px 0",borderBottom:"1px solid var(--b1)"}}>
            <div style={{width:38,height:38,borderRadius:10,flexShrink:0,background:t.type==="earn"?"rgba(0,229,160,.1)":"rgba(255,77,109,.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>{t.type==="earn"?"📥":"📤"}</div>
            <div style={{flex:1}}><div style={{fontSize:13,fontWeight:500}}>{t.desc}</div><div style={{fontSize:11,color:"var(--txt2)",marginTop:2}}>{t.date}</div></div>
            <div style={{fontFamily:"var(--fm)",fontWeight:600,color:t.c,fontSize:13}}>{t.amt}</div>
          </div>
        ))}
        <div style={{height:24}}/>
      </div>
    </div>
  );
}

/* ══ ROOT APP ═══════════════════════════════════════════════════════ */
function App(){
  const [showOnboard,setShowOnboard]=useState(true);
  const [showBoard,setShowBoard]=useState(false);
  const [screen,setScreen]=useState("activity");
  const [menuOpen,setMenuOpen]=useState(false);
  const [notifs,setNotifs]=useState(NOTIFS);
  const [user,setUser]=useState({
    name:"New Member",level:"ASSOCIATE STAFF",
    isPermanent:false,salary:0.00,
    accuracy:0,jobsDone:0,rank:999,hoursLeft:3,
    streak:0,jobsToday:0,
    refCode:"NEW-0001",
    completedModules:[],quizPassed:false,
    trainingDone:false,lensActivated:false,kycDone:false,
  });
  const notifCount=notifs.filter(n=>!n.read).length;
  const mainScreens=["activity","training","workspace","recruit","wallet"];
  function goBack(){setScreen("activity");}

  if(showOnboard)return<><style>{G}</style><Onboarding onDone={()=>{setShowOnboard(false);setShowBoard(true);}}/></>;
  if(showBoard)return<><style>{G}</style><AgentBoard onActivate={()=>setShowBoard(false)}/></>;

  return(
    <>
      <style>{G}</style>
      <div style={{maxWidth:430,margin:"0 auto",height:"100vh",background:"var(--bg)",display:"flex",flexDirection:"column",position:"relative",overflow:"hidden"}}>
        <div style={{flex:1,overflowY:"auto",paddingBottom:mainScreens.includes(screen)?72:0}}>
          {screen==="activity"     &&<ActivityScreen user={user} setScreen={setScreen} notifCount={notifCount} setMenuOpen={setMenuOpen}/>}
          {screen==="training"     &&<TrainingScreen user={user} setUser={setUser}/>}
          {screen==="workspace"    &&<WorkspaceScreen user={user} setUser={setUser}/>}
          {screen==="recruit"      &&<RecruitScreen user={user}/>}
          {screen==="wallet"       &&<WalletScreen user={user} setUser={setUser}/>}
          {screen==="notifications"&&<NotificationsScreen notifs={notifs} setNotifs={setNotifs} onBack={goBack}/>}
          {screen==="profile"      &&<ProfileScreen user={user} onBack={goBack}/>}
          {screen==="leaderboard"  &&<LeaderboardScreen onBack={goBack}/>}
          {screen==="tier"         &&<TierScreen user={user} onBack={goBack}/>}
          {screen==="kyc"          &&<KYCScreen user={user} setUser={setUser} onBack={goBack}/>}
          {screen==="payout"       &&<PayoutScreen onBack={goBack}/>}
          {screen==="settings"     &&<SettingsScreen onBack={goBack}/>}
          {screen==="terms"        &&<TermsScreen onBack={goBack}/>}
          {screen==="support"      &&<SupportScreen onBack={goBack}/>}
        </div>
        {mainScreens.includes(screen)&&(
          <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:"rgba(6,10,18,.97)",backdropFilter:"blur(24px)",borderTop:"1px solid var(--b2)",display:"flex",padding:"8px 0 14px",zIndex:100}}>
            {NAV.map(item=>(
              <button key={item.id} onClick={()=>setScreen(item.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3,background:"none",border:"none",cursor:"pointer",color:screen===item.id?"var(--cyan)":"var(--txt3)",transition:"color .2s"}}>
                <span style={{fontSize:17,lineHeight:1}}>{item.icon}</span>
                <span style={{fontSize:9,fontFamily:"var(--fm)",fontWeight:screen===item.id?600:400,letterSpacing:.5}}>{item.label}</span>
                {screen===item.id&&<div style={{width:16,height:2,background:"var(--cyan)",borderRadius:2,marginTop:1}}/>}
              </button>
            ))}
          </div>
        )}
        <SlideMenu user={user} open={menuOpen} onClose={()=>setMenuOpen(false)} setScreen={setScreen}/>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
